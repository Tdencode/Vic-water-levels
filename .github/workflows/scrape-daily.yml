name: Daily scrape

on:
  schedule:
    # 04:00 UTC = 14:00 AEST (UTC+10) / 15:00 AEDT (UTC+11).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company slug to run a single adapter"
        required: false
        type: string
      dry_run:
        description: "Print readings without writing to Supabase"
        required: false
        type: boolean
        default: false

# Don't pile up runs if a manual trigger lands while the scheduled one is
# still going. Daily readings are idempotent so cancelling is safe.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scrapers
        working-directory: scrapers
        run: pip install -e .

      - name: Run scrapers
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Boolean workflow_dispatch inputs arrive as the strings 'true'/'false'.
        # A bare `inputs.dry_run &&` treats 'false' as truthy (non-empty string),
        # so we use == true to get correct boolean semantics.
        run: >-
          python -m scrapers.runner
          ${{ inputs.company && format('--company {0}', inputs.company) || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
