name: Daily scrape

on:
  schedule:
    # 20:00 UTC = 06:00 AEST (UTC+10) / 07:00 AEDT (UTC+11). Late enough
    # that overnight publishes have landed; (storage_id, reading_date)
    # uniqueness makes a re-run on the same day a no-op.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company slug to run a single adapter"
        required: false
        type: string
      dry_run:
        description: "Print readings without writing to Supabase"
        required: false
        type: boolean
        default: false

# Don't pile up runs if a manual trigger lands while the scheduled one is
# still going. Daily readings are idempotent so cancelling is safe.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scrapers
        working-directory: scrapers
        run: pip install -e .

      - name: Run scrapers
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.company }}" ]; then ARGS="$ARGS --company ${{ inputs.company }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m scrapers.runner $ARGS
